# uptimer configuration. Full reference: https://github.com/AndreaAcanfora/uptimer#configuration
#
# ${VAR} is replaced with the environment variable VAR: keep tokens and passwords out of this file.

title: My services status
listen: ":8080"            # status page address
database: uptimer.db       # SQLite file, created if missing
retention: 90d             # keep results for 90 days

defaults:
  interval: 1m             # how often each check runs
  timeout: 10s
  failure_threshold: 2     # consecutive failures before alerting (avoids false alarms)
  cert_expiry_days: 14     # warn when a TLS certificate expires within 14 days

checks:
  - name: Website
    url: https://example.com

  - name: API health
    url: https://api.example.com/health
    expect_status: [200]
    contains: '"status":"ok"'   # the response body must contain this text
    interval: 30s

  - name: Database port
    type: tcp
    address: db.example.com:5432

