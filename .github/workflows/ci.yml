name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.out ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg VERSION=ci -t uptimer:ci .
      - name: Smoke test
        run: |
          docker run --rm uptimer:ci version
          printf 'checks:\n  - name: GitHub\n    url: https://github.com\n' > uptimer.yml
          docker run --rm -v "$PWD:/data" uptimer:ci check
